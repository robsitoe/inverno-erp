server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend API routes
    location ~* ^/(auth|hr|sales|purchases|treasury|accounting|licenses|users|profiles|companies|company|tenants|inventory|reports|series|fiscal-years|journals|customers|suppliers|articles|generic-entities|entities|delivery-points|workflow-history|document-types|test-route|payment-methods|taxes|sync|mobile|fleet|trips)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Serve Angular SPA — all other paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Cache static assets (Angular uses content-hashed filenames)
    location ~* \.(js|css|png|jpg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
