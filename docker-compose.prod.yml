# Nome fixo: os dados (volumes) NAO dependem do nome da pasta onde o sistema esta instalado
name: inverno-erp

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-inverno_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: inverno/backend:${INVERNO_VERSION:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-inverno_erp}
      JWT_SECRET: ${JWT_SECRET}
      LICENSE_SECRET: ${LICENSE_SECRET}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-}
      SEED_DEMO: "false"
      ALLOW_ADMIN_FALLBACK: "false"
      BACKUP_DIR: /backups
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - backups_data:/backups
    expose:
      - "3000"

  frontend:
    image: inverno/frontend:${INVERNO_VERSION:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres_data:
  backups_data:
